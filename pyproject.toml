[project]
name = "stpreview"
description = "build downsampled previews of space telescope products"
readme = "README.md"
requires-python = ">=3.12"
license-files = ["LICENSE"]
authors = [{ name = "Zach Burnett", email = "zburnett@stsci.edu" }]
classifiers = [
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
  "asdf",
  "astropy",
  "gwcs",
  "matplotlib",
  "numpy",
  "scikit-image",
]
dynamic = ["version"]

[project.urls]
repository = "https://github.com/spacetelescope/stpreview.git"

[project.scripts]
stpreview = "stpreview.__main__:command"

[dependency-groups]
contrib = ["pyrefly", "ruff"]
test = ["pytest>=9.0", "roman_datamodels"]

[build-system]
requires = ["setuptools_scm[toml] >=3.4", "setuptools >=60", "wheel"]
build-backend = "setuptools.build_meta"

[tool.coverage.run]
omit = ["**/tests/*"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if self.debug:",
  "except ImportError",
  "raise AssertionError",
  "raise NotImplementedError",
  "if __name__ == \"__main__\":",
]

[tool.pytest]
markers = ["shareddata: run tests with shared data"]

[tool.ruff]
line-length = 127
exclude = [".tox", ".eggs", "build"]

[tool.setuptools]
zip-safe = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
